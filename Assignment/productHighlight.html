<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Highlight</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: Arial; padding: 40px; }
        .product-list { display: flex; gap: 20px; }
        .product { width: 180px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; position: relative; transition: .3s; }
        .product:hover .details { display: block; }
        .highlight { background: #e8f4ff; border-color: #007bff; }
        .favorite { font-size: 24px; position: absolute; top: 10px; right: 10px; cursor: pointer; }
        .favorite.selected { color: red; }
        .details { display: none; margin-top: 10px; font-size: 14px; color: #555; }
        .product[data-discount="true"] { border-color: green; background: #e6ffe6; }
    </style>
</head>

<body>

<header>
    <h1>Product Highlight Demo</h1>
</header>

<main>
<section class="product-list">

    <div class="product" data-stock="yes" data-discount="true">
        <div class="favorite">❤</div>
        <h3>Wireless Earbuds</h3>
        <p>₹1299</p>
        <div class="details">Great bass, 20hr backup</div>
    </div>

    <div class="product" data-stock="no" data-discount="false">
        <div class="favorite">❤</div>
        <h3>Smart Watch</h3>
        <p>₹1999</p>
        <div class="details">Heart-rate, Waterproof</div>
    </div>

    <div class="product" data-stock="yes" data-discount="true">
        <div class="favorite">❤</div>
        <h3>Bluetooth Speaker</h3>
        <p>₹999</p>
        <div class="details">Deep sound, portable</div>
    </div>

</section>
</main>

<footer>
    <p>© 2025 Product UI Demo</p>
</footer>

<script>
    $(document).ready(function () {
        $(".product").click(function (e) {
            if ($(e.target).hasClass("favorite")) return;
            if ($(this).data("stock") === "no") {
                alert("This product is out of stock!");
                return;
            }
            $(".product").removeClass("highlight");
            $(this).addClass("highlight");
        });

        $(".favorite").click(function () {
            $(this).toggleClass("selected");
        });
    });
</script>

</body>
</html>
