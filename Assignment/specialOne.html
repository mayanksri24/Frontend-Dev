<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer Banner</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body { font-family: Arial; padding: 40px; }
        .banner-container { width: 600px; margin-bottom: 20px; }
        .banner { padding: 20px; background: #ffefc6; border: 1px solid #d4b673; border-radius: 8px; margin-bottom: 10px; display: none; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; }
    </style>
</head>

<body>

<header>
    <h1>Special Offer Banners</h1>
</header>

<main>

<div class="controls">
    <button id="hide">Hide</button>
    <button id="show">Show</button>
    <button id="slide">Slide Up/Down</button>
    <button id="fade">Fade In/Out</button>
</div>

<div class="banner-container">
    <div class="banner" style="display:block;">🔥 50% OFF on Electronics!</div>
    <div class="banner">🎉 Buy 1 Get 1 Free on Clothing!</div>
    <div class="banner">🚚 Free Delivery on Orders Over ₹499!</div>
</div>

</main>

<footer>
    <p>© 2025 Offer Banner Demo</p>
</footer>

<script>
    $(document).ready(function () {

        $("#hide").click(function () {
            $(".banner").hide();
        });

        $("#show").click(function () {
            $(".banner").show();
        });

        $("#slide").click(function () {
            $(".banner").slideToggle();
        });

        $("#fade").click(function () {
            $(".banner").fadeToggle();
        });

        let index = 0;
        setInterval(function () {
            let banners = $(".banner");
            banners.fadeOut();
            $(banners[index]).fadeIn();
            index = (index + 1) % banners.length;
        }, 5000);
    });
</script>

</body>
</html>
