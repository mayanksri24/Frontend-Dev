<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Timetable Viewer</title>

<style>
    body { font-family: Arial; padding: 40px; }
    select { padding: 8px; margin-bottom: 20px; }
    .class-box { padding: 12px; border: 1px solid #ccc; margin-bottom: 10px; border-radius: 6px; }
    .no-class { color: red; font-weight: bold; }
</style>
</head>

<body>

<h2>College Timetable Viewer</h2>

<select id="daySelect">
    <option value="">Select Day</option>
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>
</select>

<div id="output"></div>

<script>
document.getElementById("daySelect").addEventListener("change", function(){
    let day = this.value;
    let box = document.getElementById("output");
    box.innerHTML = "";

    if(day === "") return;

    fetch("http://localhost:3005/timetable?day=" + day)
        .then(res => res.json())
        .then(data => {
            if(data.length === 0) {
                box.innerHTML = `<p class="no-class">No classes today.</p>`;
                return;
            }

            data.forEach(item => {
                box.innerHTML += `
                    <div class="class-box">
                        <b>Subject:</b> ${item.subject} <br>
                        <b>Faculty:</b> ${item.faculty} <br>
                        <b>Time:</b> ${item.time}
                    </div>
                `;
            });
        });
});
</script>

</body>
</html>
