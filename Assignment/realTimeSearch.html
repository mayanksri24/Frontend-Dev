<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Product Search</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
    body { font-family: Arial; padding: 40px; }
    #search { width: 300px; padding: 10px; }
    #loader { display: none; margin-top: 10px; }
    .product { display: flex; align-items: center; padding: 10px; border: 1px solid #ddd; margin-top: 10px; border-radius: 6px; }
    .product img { width: 60px; height: 60px; margin-right: 15px; }
    #results { margin-top: 20px; }
</style>
</head>

<body>

<h2>Live Search Products</h2>

<input type="text" id="search" placeholder="Search products...">
<div id="loader">Loading...</div>
<div id="results"></div>

<script>
$(function(){
    $("#search").on("keyup", function(){
        let q = $(this).val().trim();
        $("#loader").show();

        $.ajax({
            url: "http://localhost:3001/products?q=" + q,
            method: "GET",
            success: function(data){
                $("#loader").hide();
                $("#results").empty();

                if(data.length === 0){
                    $("#results").html("<p>No products found</p>");
                    return;
                }

                data.forEach(item => {
                    $("#results").append(`
                        <div class="product">
                            <img src="${item.image}">
                            <div>
                                <h4>${item.name}</h4>
                                <p>₹${item.price}</p>
                            </div>
                        </div>
                    `);
                });
            }
        });
    });
});
</script>

</body>
</html>
